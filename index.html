const _v = new THREE.Vector3();

function syncLand(dt){
  // figures
  for(const u of G.units){
    let g3 = land.units.get(u.id);
    if(!g3){ addUnitMesh(u); g3 = land.units.get(u.id); if(!g3) continue; }
    g3.position.set(wx(u.x), 0, wz(u.y));
    g3.rotation.y = u.face;
    const d = g3.userData;
    const gathering = u.task && u.task.phase==='gather';
    const sw = u.moving ? Math.sin(u.swing)*0.55 : 0;
    d.legs[0].rotation.x =  sw; d.legs[1].rotation.x = -sw;
    if(gathering){
      const chop = Math.sin(u.swing*1.6);
      d.arms[0].rotation.x = -1.1 + chop*0.9; d.arms[1].rotation.x = -1.1 + chop*0.9;
    } else {
      d.arms[0].rotation.x = -sw*0.8; d.arms[1].rotation.x = sw*0.8;
    }
    g3.position.y = u.moving ? Math.abs(Math.sin(u.swing))*0.07 : 0;
    d.load.visible = u.carry>0;
    d.ring.visible = (G.selected === u);
  }
  // buildings
  for(const [k, rec] of Object.entries(land.sites)){
    const vis = G.built[k] || (k==='inn'&&G.chapter>=2) || (k==='shipyard'&&G.chapter>=3)
             || ((k==='smithy'||k==='chapel')&&G.chapter>=4);
    rec.holder.visible = vis;
    if(!vis) continue;
    if(rec.ghost) rec.ghost.rotation.y = Math.sin(G.t*0.6)*0.02;
    if(rec.built && k==='inn' && rec.built.userData.sign)
      rec.built.userData.sign.rotation.z = Math.sin(G.t*1.1)*0.10;
    if(rec.built && k==='smithy'){
      const fl = rec.built.userData.forgeLight;
      if(fl) fl.intensity = 18 + Math.sin(G.t*9)*5 + Math.sin(G.t*23)*3;
    }
  }
  // smithy smoke
  if(G.built.smithy && !reduceMotion){
    land.smokeT -= dt;
    if(land.smokeT <= 0){
      land.smokeT = 0.42;
      const rec = land.sites.smithy, c = rec.built.userData.chimney;
      _v.copy(c).applyMatrix4(rec.holder.matrixWorld);
      burst(_v.x, _v.y, _v.z, {n:5, color:0x8b8577, size:1.5, speed:0.7, life:3.2, grav:-0.5, up:1.6, spread:0.5});
    }
  }
  // Pequod riding at anchor
  if(land.ship){
    const w = land.water.userData;
    const px = land.ship.position.x, pz = land.ship.position.z;
    land.ship.position.y = w.waveH(px, pz)*0.6 + 0.55;
    land.ship.rotation.z = (w.waveH(px+7,pz) - w.waveH(px-7,pz))*0.035;
    land.ship.rotation.x = (w.waveH(px,pz+3) - w.waveH(px,pz-3))*0.05;
    land.ship.userData.band.visible = provDone();
    land.ship.userData.doubloon.visible = G.chapter>=4 && ch4Ready();
    flapSails(land.ship, 0.35);
  }
}

function flapSails(ship, amt){
  if(reduceMotion || !ship.userData.sails[0].visible) return;
  for(const s of ship.userData.sails){
    const arr = s.geometry.attributes.position.array, base = s.userData.base;
    for(let i=0;i<arr.length;i+=3){
      const u = base[i], v = base[i+1];
      arr[i+2] = Math.sin(u*0.9 + G.t*2.2 + s.userData.phase) * amt * (1 - Math.abs(u)/6) + amt*0.8;
      arr[i] = u; arr[i+1] = v;
    }
    s.geometry.attributes.position.needsUpdate = true;
  }
}

function whaleMesh(kind){
  if(kind==='moby'){
    if(!sea.moby){ sea.moby = makeWhale(true); seaScene.add(sea.moby);
      sea.mobyBar = makeBar(14, 1.35, 0xe8e2d2, 'MOBY DICK'); seaScene.add(sea.mobyBar); }
    return sea.moby;
  }
  if(!sea.whale){ sea.whale = makeWhale(false); seaScene.add(sea.whale);
    sea.whaleBar = makeBar(8, 0.85, 0x7fa3b8); seaScene.add(sea.whaleBar); }
  return sea.whale;
}
function dropWhale(kind){
  const k = kind==='moby'?'moby':'whale', bk = kind==='moby'?'mobyBar':'whaleBar';
  if(sea[k]){ seaScene.remove(sea[k]); disposeDeep(sea[k]); sea[k]=null; }
  if(sea[bk]){ seaScene.remove(sea[bk]); disposeDeep(sea[bk]);
    const i = billboards.indexOf(sea[bk]); if(i>=0) billboards.splice(i,1); sea[bk]=null; }
}

function placeOnWave(obj, x, z, {sink=0, rollK=0.05, len=6}={}){
  const w = sea.water.userData;
  obj.position.set(x, w.waveH(x,z) - sink, z);
  obj.rotation.z = (w.waveH(x+len,z) - w.waveH(x-len,z)) * rollK;
  obj.rotation.x = (w.waveH(x,z+len*0.4) - w.waveH(x,z-len*0.4)) * rollK*1.4;
}

function syncSea(dt){
  const w = sea.water.userData;
  // the ship
  const sx = wx(150), sz = wz(330);
  placeOnWave(sea.ship, sx, sz, {sink:-0.55, rollK:0.05, len:8});
  sea.ship.userData.tryworks.visible = G.res.oil > 0;
  flapSails(sea.ship, mood==='storm'?0.75:0.45);
  sea.shipBar.position.set(sx, 16.5, sz);
  sea.shipBar.userData.set(G.ship.hp/G.ship.max);

  // boats
  G.sea.boats.forEach((b, i)=>{
    const g3 = sea.boats[i], bar = sea.boatBars[i], line = sea.lines[i];
    const show = b.state!=='aboard' && b.state!=='sunk';
    g3.visible = show; bar.visible = show; line.visible = false;
    if(!show) return;
    const bx = wx(b.x), bz = wz(b.y);
    placeOnWave(g3, bx, bz, {sink:0.52, rollK:0.10, len:2.4});
    g3.rotation.y = b.face;
    const rowing = b.state==='rowing';
    for(const o of g3.userData.oars){
      o.rotation.x = o.userData.sgn*(1.15 + (rowing? Math.sin(b.row + o.userData.i*0.5)*0.5 : 0.1));
    }
    g3.userData.harpooneer.rotation.z = b.state==='fighting' ? Math.sin(G.t*6+i)*0.35 : 0;
    bar.position.set(bx, 3.0, bz);
    bar.visible = show && b.hp < b.max - 0.01;
    bar.userData.set(b.hp/b.max);
    // the line, taut from the bow to the fast whale
    const tgt = G.moby || G.sea.whale;
    if(b.state==='fighting' && tgt){
      const tx = wx(tgt.x), tz = wz(tgt.y);
      const p = line.geometry.attributes.position.array;
      p[0]=bx+Math.cos(b.face)*2.2; p[1]=g3.position.y+1.2; p[2]=bz-Math.sin(b.face)*2.2;
      p[3]=tx; p[4]=w.waveH(tx,tz)+0.6; p[5]=tz;
      line.geometry.attributes.position.needsUpdate = true;
      line.visible = true;
    }
  });

  // whales
  if(G.sea.whale){
    const m = whaleMesh('whale'), q = G.sea.whale;
    const x = wx(q.x), z = wz(q.y), sub = q.diveT>0;
    placeOnWave(m, x, z, {sink: sub ? 4.6 : 0.28, rollK:0.03, len:5});
    m.rotation.y = q.face;
    spoutPulse(m, q.spout, sub?0:1);
    sea.whaleBar.position.set(x, 5.4, z);
    sea.whaleBar.userData.set(q.hp/q.max);
    sea.whaleBar.visible = !sub;
  } else if(sea.whale) dropWhale('whale');

  if(G.moby){
    const m = whaleMesh('moby'), q = G.moby;
    const x = wx(q.x), z = wz(q.y);
    const sub = q.diveT>0;
    placeOnWave(m, x, z, {sink: sub? 6.0 : 0.20, rollK:0.03, len:7});
    m.rotation.y = q.face;
    m.traverse(o=>{ if(o.isMesh && o.material.transparent!==undefined){} });
    m.visible = true;
    m.scale.setScalar(1);
    spoutPulse(m, q.spout, sub?0:1.6);
    sea.mobyBar.position.set(x, 9.6, z);
    sea.mobyBar.userData.set(q.hp/q.max);
    sea.mobyBar.visible = !sub;
  } else if(sea.moby) dropWhale('moby');

  // rain
  const raining = G.sea.rainT > 0;
  sea.rain.visible = raining;
  if(raining){
    const p = sea.rain.geometry.attributes.position.array;
    const dy = 52*dt, dx = 9*dt;
    for(let i=0;i<p.length;i+=6){
      p[i]-=dx; p[i+1]-=dy; p[i+3]-=dx; p[i+4]-=dy;
      if(p[i+4] < -1){
        const x0=rnd(-80,80), z0=rnd(-60,60);
        p[i]=x0; p[i+1]=46; p[i+2]=z0;
        p[i+3]=x0+0.5; p[i+4]=43.8; p[i+5]=z0;
      }
    }
    sea.rain.geometry.attributes.position.needsUpdate = true;
  }
  if(sea.sun){                                  // the squall puts out the sun
    const want = raining ? 0.42 : 1;
    sea.sun.userData.dim = lerp(sea.sun.userData.dim ?? 1, want, Math.min(1, dt*2.2));
    sea.sun.intensity = (sea.sun.userData.base ?? 2.4) * sea.sun.userData.dim;
  }
  setMood();
}
function spoutPulse(m, phase, strength){
  const sp = m.userData.spout;
  const k = (Math.sin(phase*1.4)+1)/2;
  const on = Math.max(0, (k-0.55)/0.45);
  sp.material.opacity = on * 0.85 * strength;
  sp.scale.set(1, 0.4 + on*0.9, 1);
}

const CAM = {

let rig = CAM.title;
function frameCamera(){
  const a = Math.max(camera.aspect, 0.30);
  // exactly the distance at which the 1000-unit-wide board still spans the view
  const need = 53 / (Math.tan(camera.fov*Math.PI/360) * a);
  rig.k = rig.fit ? Math.max(1, need / rig.d) : 1;
  // portrait: look further down instead of wasting the tall frame on sky
  const port = clamp((1.20 - a)/0.55, 0, 1);
  rig.tiltUse = lerp(rig.tilt, 1.20, port);
  rig.biasUse = rig.bias * (1 - port);
  rig.tzUse   = lerp(rig.tz, rig.tzP, port);
  applyFog();
}
function applyFog(){
  if(!scene || !scene.fog || scene.userData.fogNear === undefined) return;
  const k = rig.k || 1;
  scene.fog.near = scene.userData.fogNear * k;
  scene.fog.far  = scene.userData.fogFar  * k;
}
function placeCamera(dt){
  const d = rig.d * (rig.k || 1);
  const tilt = rig.tiltUse ?? rig.tilt;
  const drift = reduceMotion ? 0 : Math.sin(G.t*0.10)*1.4;
  camTarget.set((rig.tx||0) + drift*0.6, rig.ty, rig.tzUse ?? rig.tz);
  camera.position.set(
    camTarget.x + drift,
    camTarget.y + d*Math.sin(tilt),
    camTarget.z + d*Math.cos(tilt));
  camera.lookAt(camTarget);
  camera.rotateX(rig.biasUse ?? rig.bias);
  if(clockShake.amt > 0.001){
    const a = clockShake.amt;
    camera.position.x += rnd(-a,a)*1.4;
    camera.position.y += rnd(-a,a)*1.1;
    camera.rotateZ(rnd(-a,a)*0.014);
    clockShake.amt = Math.max(0, a - dt*2.2);
  }
}

function setScene(sc){
  scene = sc;
  if(renderPass) renderPass.scene = sc;
  rig = sc === seaScene ? CAM.sea : sc === landScene ? CAM.land : CAM.title;
  frameCamera(); applyFog();
}

function resize(){
  const wrap = document.getElementById('canvasWrap');
  const r = wrap.getBoundingClientRect();
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  if(composer){ composer.setSize(w,h); if(bloomPass) bloomPass.setSize(w,h); }
  frameCamera();
}
addEventListener('resize', resize);

/* =====================================================================
   frame
   ===================================================================== */
function render(dt){
  uTime.value = G.t;
  if(scene === landScene && landScene) syncLand(dt);
  else if(scene === seaScene && seaScene) syncSea(dt);
  else if(scene && scene.userData.ship){          // the title sea
    const w = scene.userData.water.userData, s = scene.userData.ship;
    s.position.y = w.waveH(s.position.x, s.position.z)*0.6 + 0.55;
    s.rotation.z = -0.5*0 + (w.waveH(s.position.x+7,s.position.z)-w.waveH(s.position.x-7,s.position.z))*0.05;
    flapSails(s, 0.5);
  }
  updateFX(dt);
  placeCamera(dt);
  for(const b of billboards) b.quaternion.copy(camera.quaternion);
  if(composer) composer.render(); else renderer.render(scene, camera);
}

/* boot the ambient title sea straight away */
setScene(buildTitle());
resize();

return {
  get camera(){ return camera; },
  buildLand, buildSea, addUnit:addUnitMesh, raiseBuilding, setMood,
  ping, puff, sparks, splash, blood, shake, dust,
  syncSelection(){}, render, resize,
};
})();

/* ------------------------------------------------ main loop -------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const running = $('overlay').classList.contains('hidden');
  if(running){
    G.t += dt;
    if(G.scene==='land') updateLand(dt);
    else if(G.scene==='sea' && !G.interlude) updateSea(dt);
    updateHUD();
  } else {
    G.t += dt*0.35;      // the sea keeps moving behind the page
  }
  VIEW.render(dt);
  requestAnimationFrame(loop);
}

/* periodically refresh button disabled states */
setInterval(()=>{ if((G.scene==='land'||G.scene==='sea') && $('overlay').classList.contains('hidden')) renderActions(); }, 900);

window.__ahabBooted = true;
$('boot').classList.add('hidden');
titlePage(); updateHUD(); renderActions();
quickStart();
requestAnimationFrame(loop);
</script>
</body>
