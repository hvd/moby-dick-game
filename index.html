<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AHAB — A Whaling Strategy in Six Chapters</title>
<style>
  :root{
    --ink:#0d1b24;          /* night sea */
    --deep:#122633;
    --parch:#e9dcc0;        /* whale-oil parchment */
    --bone:#f6efdd;         /* scrimshaw bone */
    --blood:#8e2a1e;        /* harpoon red */
    --gold:#c9a24b;         /* the doubloon */
    --rope:#7a5c38;
    --faint:#b7a888;
    --serif:"Palatino Linotype","Book Antiqua","Iowan Old Style",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--ink);font-family:var(--serif);color:var(--parch)}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #canvasWrap{position:relative;flex:1;min-height:0;background:#050b10}

  /* ---------- top bar ---------- */
  #topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:7px 12px;background:linear-gradient(#20160d,#170f08);
    border-bottom:2px solid #000;box-shadow:0 2px 8px rgba(0,0,0,.6);
    font-size:14px;user-select:none;z-index:5;
  }
  .res{display:flex;align-items:center;gap:5px;color:var(--bone);letter-spacing:.3px}
  .res b{font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
  .res .ic{font-size:15px;filter:saturate(.7)}
  #objective{
    margin-left:auto;font-style:italic;color:var(--faint);font-size:13px;
    max-width:52%;text-align:right;line-height:1.25;
  }
  #doubloon{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #f0d68a, #c9a24b 55%, #7c5c1e);
    border:1px solid #3c2c0c;box-shadow:0 0 6px rgba(201,162,75,.5);
    display:inline-block;vertical-align:middle;
  }

  /* ---------- action bar ---------- */
  #actionbar{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(#170f08,#0d0803);border-top:2px solid #000;z-index:5;
    min-height:52px;
  }
  button.act{
    font-family:var(--serif);font-size:13.5px;letter-spacing:.3px;
    color:var(--bone);background:linear-gradient(#3a2a19,#241708);
    border:1px solid #59452a;border-radius:3px;padding:8px 12px;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 4px rgba(0,0,0,.5);
  }
  button.act:hover:not(:disabled){background:linear-gradient(#4a3722,#2e1e0c);border-color:var(--gold)}
  button.act:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.act:disabled{opacity:.42;cursor:not-allowed}
  button.act.red{background:linear-gradient(#5c1d14,#3a0f09);border-color:#8e2a1e}
  button.act.red:hover:not(:disabled){border-color:#d0553f}
  button.act small{display:block;color:var(--faint);font-size:11px;font-style:italic}
  #hint{font-size:12px;color:var(--faint);font-style:italic;margin-left:auto;max-width:38%;text-align:right;line-height:1.3}

  /* ---------- ship log ---------- */
  #log{
    position:absolute;left:10px;bottom:10px;z-index:4;pointer-events:none;
    font-size:12.5px;line-height:1.45;text-shadow:0 1px 3px #000,0 0 10px #000;max-width:min(62vw,430px);
  }
  #log div{opacity:.92;color:var(--parch)}
  #log div:nth-last-child(n+3){opacity:.55}
  #log em{color:var(--gold);font-style:normal}

  /* ---------- overlays as book pages ---------- */
  #overlay{
    position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(5,10,15,.66);padding:18px;overflow:auto;
    backdrop-filter:blur(3px);
  }
  #overlay.hidden{display:none}
  .page{
    background:
      radial-gradient(ellipse at 20% 8%, rgba(255,255,255,.5), transparent 40%),
      linear-gradient(105deg, #efe4c8, #e4d5b2 55%, #d9c7a0);
    color:#2a2015;max-width:640px;width:100%;
    border:1px solid #a08a5e;border-radius:2px;
    box-shadow:0 0 0 6px rgba(0,0,0,.35), 0 22px 60px rgba(0,0,0,.7);
    padding:34px 38px 30px;position:relative;
  }
  .page::before,.page::after{content:"";position:absolute;top:8px;bottom:8px;width:1px;background:rgba(122,92,56,.35)}
  .page::before{left:14px}.page::after{right:14px}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#8e2a1e;text-align:center;margin-bottom:6px}
  .page h1{font-size:clamp(26px,5vw,40px);text-align:center;letter-spacing:.06em;font-weight:700;color:#241a0e;margin-bottom:4px}
  .page h2{font-size:clamp(19px,4vw,26px);text-align:center;letter-spacing:.12em;font-weight:700;color:#241a0e;margin-bottom:10px}
  .whale-rule{display:flex;align-items:center;gap:10px;margin:12px 0 16px;color:#7a5c38}
  .whale-rule::before,.whale-rule::after{content:"";flex:1;height:1px;background:#a08a5e}
  .whale-rule svg{flex:0 0 auto}
  .quote{font-style:italic;text-align:center;font-size:15.5px;line-height:1.55;color:#40331f;margin-bottom:14px}
  .quote .att{display:block;font-style:normal;font-size:12px;letter-spacing:.18em;color:#8e6f3f;margin-top:6px;text-transform:uppercase}
  .objectives{margin:0 auto 18px;max-width:460px;font-size:14.5px;line-height:1.7;color:#33281a}
  .objectives li{list-style:none;padding-left:22px;position:relative}
  .objectives li::before{content:"⚓";position:absolute;left:0;font-size:12px;color:#8e2a1e}
  .page .btnrow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  .page button{
    font-family:var(--serif);font-size:16px;letter-spacing:.14em;text-transform:uppercase;
    background:#241a0e;color:var(--bone);border:1px solid #8e6f3f;border-radius:2px;
    padding:11px 26px;cursor:pointer;
  }
  .page button:hover{background:#3a2a19;border-color:var(--gold)}
  .page button:focus-visible{outline:2px solid #8e2a1e;outline-offset:2px}
  .page p.body{font-size:14.5px;line-height:1.65;color:#33281a;margin-bottom:12px;text-align:justify}
  .page p.body:first-letter{font-size:2.6em;line-height:.8;float:left;padding:4px 6px 0 0;color:#8e2a1e;font-weight:700}
  .small-note{font-size:12px;color:#8e6f3f;text-align:center;margin-top:14px;font-style:italic}
  .skiprow{margin-top:8px;font-style:normal;letter-spacing:.04em}
  .skiprow a{color:#8e2a1e;text-decoration:underline dotted;cursor:pointer}
  .skiprow a:hover{color:#241a0e}

  /* selection ring in DOM tooltip */
  #selinfo{
    position:absolute;top:8px;left:10px;z-index:4;pointer-events:none;
    font-size:12.5px;color:var(--bone);text-shadow:0 1px 3px #000,0 0 10px #000;font-style:italic;
  }

  /* ---------- boot / failure ---------- */
  #boot{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 40%, #14242f, #050b10 70%);
  }
  #boot.hidden{display:none}
  #boot .t{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}
  #boot .m{font-size:15px;color:var(--parch);max-width:440px;line-height:1.6;font-style:italic}
  #boot .wake{width:190px;height:2px;background:linear-gradient(90deg,transparent,#c9a24b,transparent);
    animation:swell 1.9s ease-in-out infinite}
  @keyframes swell{0%,100%{opacity:.25;transform:scaleX(.55)}50%{opacity:1;transform:scaleX(1)}}

  @media (max-width:640px){
    #objective{max-width:100%;text-align:left;margin-left:0;flex-basis:100%}
    #hint{display:none}
    .page{padding:26px 22px 24px}
    button.act{font-size:15px;padding:12px 14px;min-height:46px}
    button.act small{font-size:12px}
    #topbar{font-size:15px;gap:16px}
    #log{font-size:13.5px;max-width:88vw}
  }
  @media (prefers-reduced-motion: reduce){ .noanim{display:none} #boot .wake{animation:none} }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <span class="res"><span class="ic">🪵</span><b id="rWood">0</b></span>
    <span class="res"><span class="ic">🍖</span><b id="rFood">0</b></span>
    <span class="res"><span id="doubloon"></span><b id="rGold">0</b></span>
    <span class="res" id="oilBox" style="display:none"><span class="ic">🛢️</span><b id="rOil">0</b></span>
    <span class="res" id="crewBox"><span class="ic">👥</span><b id="rCrew">0</b></span>
    <span id="objective"></span>
  </div>

  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="selinfo"></div>
    <div id="log"></div>
    <div id="overlay" class="hidden"></div>
    <div id="boot">
      <div class="t">Loomings</div>
      <div class="wake"></div>
      <div class="m" id="bootMsg">Rigging the sea and sky…</div>
    </div>
  </div>

  <div id="actionbar"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script>
/* If the module never boots (no WebGL, no network for the three.js CDN),
   say so in the Melvillean register rather than showing a black rectangle. */
window.__ahabBooted = false;
setTimeout(()=>{
  if(window.__ahabBooted) return;
  const b = document.getElementById('bootMsg');
  if(b) b.innerHTML = "The voyage could not be fitted out.<br><br>" +
    "AHAB draws its sea in WebGL and loads three.js from a CDN — this page needs " +
    "an internet connection the first time, and a browser with WebGL enabled.";
  const w = document.querySelector('#boot .wake'); if(w) w.style.display='none';
}, 12000);
</script>

<script type="module">
"use strict";
/* =====================================================================
   AHAB — a whaling strategy in six chapters
   Land phase: gather wood / provisions / gold in New Bedford, raise the
   Spouter-Inn, sign harpooneers, provision the Pequod.
   Sea phase: lower the boats, hunt sperm whales for oil, then the
   three-day chase of the White Whale.

   Rendering is three.js.  The game still thinks in the original 1000x620
   logical plane; VIEW maps that plane onto the y=0 ground of a 3D world
   at 1 logical unit = 0.1 world units, and every tap is raycast back.
   ===================================================================== */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

const W = 1000, H = 620;                    // logical world size
const S = 0.1;                              // logical unit -> world unit
const wx = x => (x - W/2) * S;              // logical x -> world x
const wz = y => (y - H/2) * S;              // logical y -> world z
const lx = X => X / S + W/2;                // and back again
const ly = Z => Z / S + H/2;
const HALF_W = W*S/2, HALF_D = H*S/2;       // 50 x 31

const cv = document.getElementById('cv');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------ state ------------ */
const G = {
  scene:'title', chapter:0, t:0,
  res:{wood:0, food:0, gold:0, oil:0},
  units:[], nodes:[], selected:null,
  sites:{}, built:{},
  crew:{queequeg:false, tashtego:false, daggoo:false},
  sermonHeard:false, harpoonLvl:0, sharpenDay:false,
  provision:{wood:0, food:0, gold:0},
  provReq:{wood:140, food:120, gold:70},
  sailorCap:8,
  sea:{whalesKilled:0, whale:null, boats:[], spoutT:0, squallT:18, rainT:0},
  ship:{hp:320, max:320},
  moby:null, day:0, interlude:false, god:false,
  log:[], msgId:0,
};

const NAMES = ["Ishmael","Bulkington","Pip","Dough-Boy","Perth","Fedallah","Archy","Cabaco"];
let nameIdx = 0;

/* ------------------------------------------------ chapters --------- */
const CHAPTERS = [
 null,
 { n:"Chapter I", t:"LOOMINGS",
   q:"“Call me Ishmael. Some years ago—never mind how long precisely—having little or no money in my purse … I thought I would sail about a little and see the watery part of the world.”",
   obj:["Tap a resource, and the nearest idle sailor will work it","Gather 100 wood and 60 provisions","Gold crates wait by the wharf — you will need coin soon"] },
 { n:"Chapter II", t:"THE SPOUTER-INN",
   q:"“Better sleep with a sober cannibal than a drunken Christian.”",
   obj:["Raise the Spouter-Inn (80 wood)","Sign Queequeg, prince of harpooneers (40 gold, 30 provisions)","Hire extra sailors at the Inn to speed the work (25 provisions)"] },
 { n:"Chapter III", t:"THE SHIP",
   q:"“She was a ship of the old school, rather small if anything … A noble craft, but somehow a most melancholy! All noble things are touched with that.”",
   obj:["Raise the Shipyard (80 wood, 30 gold)","Provision the Pequod: 140 wood, 120 provisions, 70 gold","Load stores at the Shipyard whenever your stockpile allows"] },
 { n:"Chapter IV", t:"THE QUARTER-DECK",
   q:"“Whosoever of ye raises me a white-headed whale with a wrinkled brow and a crooked jaw … he shall have this gold ounce, my boys!”",
   obj:["Sign Tashtego and Daggoo at the Inn","Raise the Smithy and forge barbed harpoons","Optional: raise the Chapel — Father Mapple's sermon steels the boats (+hull)","Then nail the doubloon to the mast, and sail"] },
 { n:"Chapter V", t:"THE FIRST LOWERING",
   q:"“There she blows! there! there! there! she blows! she blows!”",
   obj:["Tap a whale to lower the boats","Take 3 sperm whales — each yields oil","Spend oil on repairs; beware the squalls","Oil will be your only currency against the White Whale"] },
 { n:"Chapter VI", t:"THE CHASE — THREE DAYS",
   q:"“Towards thee I roll, thou all-destroying but unconquering whale; to the last I grapple with thee; from hell's heart I stab at thee.”",
   obj:["Moby Dick must be fought over three days","He sounds when wounded deep, and cannot be lanced until he rises","When he turns his brow upon the ship, he is charging — the hull will suffer","Spend oil to mend hull and boats between the days; if the ship goes down, so ends the voyage"] },
];

/* ------------------------------------------------ helpers ---------- */
const $ = id => document.getElementById(id);
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const rnd = (a,b)=>a + Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp =(a,b,t)=>a+(b-a)*t;

function say(msg, gold){
  G.log.push({msg, gold});
  if(G.log.length>4) G.log.shift();
  $('log').innerHTML = G.log.map(l=>`<div>${l.gold?'<em>'+l.msg+'</em>':l.msg}</div>`).join('');
}

/* ------------------------------------------------ land setup ------- */
function setupLand(){
  G.nodes = [
    {id:'t1', kind:'wood', x:120, y:150, amt:9999, label:'Timber'},
    {id:'t2', kind:'wood', x:190, y:120, amt:9999, label:'Timber'},
    {id:'t3', kind:'wood', x:250, y:170, amt:9999, label:'Timber'},
    {id:'t4', kind:'wood', x:160, y:210, amt:9999, label:'Timber'},
    {id:'f1', kind:'food', x:700, y:290, amt:9999, label:'Drying racks'},
    {id:'f2', kind:'food', x:775, y:265, amt:9999, label:'Salt cod'},
    {id:'f3', kind:'food', x:850, y:295, amt:9999, label:'Chowder pots'},
    {id:'g1', kind:'gold', x:880, y:420, amt:9999, label:'Cargo trade'},
    {id:'g2', kind:'gold', x:930, y:380, amt:9999, label:'Cargo trade'},
  ];
  G.sites = {
    inn:      {x:300, y:255, w:120, h:78, name:'Spouter-Inn',  cost:{wood:80}},
    chapel:   {x:150, y:320, w:100, h:80, name:'Whaleman’s Chapel', cost:{wood:50, gold:20}},
    smithy:   {x:455, y:230, w:104, h:70, name:'Smithy',       cost:{wood:70, gold:30}},
    shipyard: {x:600, y:400, w:150, h:80, name:'Shipyard',     cost:{wood:80, gold:30}},
  };
  G.stock = {x:470, y:360};   // wharf stores — deposit point
  G.units = [];
  for(let i=0;i<3;i++) addUnit('sailor');
  VIEW.buildLand();
}
function addUnit(type, key){
  const u = {
    id:Math.random().toString(36).slice(2),
    type, key: key||null,
    name: type==='sailor' ? NAMES[(nameIdx++)%NAMES.length] :
          key.charAt(0).toUpperCase()+key.slice(1),
    x:G.stock.x + rnd(-40,40), y:G.stock.y + rnd(10,50),
    tx:null, ty:null, speed: type==='sailor'? 78 : 70,
    task:null, carry:0, gatherT:0, bob:Math.random()*6,
    face:0, moving:false, swing:0,
  };
  G.units.push(u);
  if(G.scene==='land') VIEW.addUnit(u);
  return u;
}
const sailors = ()=>G.units.filter(u=>u.type==='sailor');
const harpooneers = ()=>G.units.filter(u=>u.type==='harpooneer');

/* ------------------------------------------------ land update ------ */
function updateLand(dt){
  for(const u of G.units){
    // movement toward target
    const goal = u.task
      ? (u.task.phase==='return' ? G.stock : {x:u.task.node.x, y:u.task.node.y})
      : (u.tx!=null ? {x:u.tx, y:u.ty} : null);
    u.moving = false;
    if(goal){
      const d = dist(u, goal);
      if(d > 6){
        const vx = (goal.x-u.x)/d * u.speed, vy = (goal.y-u.y)/d * u.speed;
        u.x += vx*dt; u.y += vy*dt;
        u.moving = true;
        u.face = Math.atan2(-vy, vx);   // models are built bow/nose along +X
      } else if(u.task){
        if(u.task.phase==='toNode'){ u.task.phase='gather'; u.gatherT=0; }
        else if(u.task.phase==='return'){
          G.res[u.task.node.kind] += u.carry;
          u.carry = 0; u.task.phase='toNode';
          checkLandProgress();
        }
      } else { u.tx=u.ty=null; }
    }
    u.swing += dt * (u.moving ? 9 : (u.task && u.task.phase==='gather' ? 7 : 0));
    if(u.task && u.task.phase==='gather'){
      u.gatherT += dt;
      const rate = u.task.node.kind==='gold' ? 2.1 : 1.6;
      if(u.gatherT >= rate){
        u.carry = u.task.node.kind==='gold' ? 10 : 14;
        u.task.phase = 'return';
        VIEW.puff(u.task.node.x, u.task.node.y, u.task.node.kind);
      }
    }
  }
}
function assignGather(node){
  let u = G.selected && G.selected.type==='sailor' ? G.selected : null;
  if(!u){
    // nearest idle sailor, else nearest sailor at all
    const idle = sailors().filter(s=>!s.task);
    const pool = idle.length? idle : sailors();
    u = pool.sort((a,b)=>dist(a,node)-dist(b,node))[0];
  }
  if(!u){ say("No sailors to send."); return; }
  u.task = {node, phase:'toNode'}; u.tx=u.ty=null;
  VIEW.ping(node.x, node.y, 0xc9a24b);
  say(`${u.name} works the ${node.label.toLowerCase()}.`);
}

function canAfford(cost){ return Object.entries(cost).every(([k,v])=>G.res[k]>=v); }
function pay(cost){ for(const [k,v] of Object.entries(cost)) G.res[k]-=v; }
function costStr(cost){
  const ic={wood:'🪵',food:'🍖',gold:'🟡',oil:'🛢️'};
  return Object.entries(cost).map(([k,v])=>`${v}${ic[k]}`).join(' ');
}

function build(key){
  const s = G.sites[key];
  if(G.built[key] || !canAfford(s.cost)) return;
  pay(s.cost); G.built[key]=true;
  VIEW.raiseBuilding(key);
  say(`The ${s.name} stands.`, true);
  if(key==='inn') say("Landlord Coffin lights the lamps. Harpooneers may be signed here.");
  checkLandProgress(); renderActions();
}
function hireHarpooneer(key){
  const costs = {queequeg:{gold:40,food:30}, tashtego:{gold:35,food:25}, daggoo:{gold:35,food:25}};
  if(G.crew[key] || !canAfford(costs[key])) return;
  pay(costs[key]); G.crew[key]=true; addUnit('harpooneer', key);
  const lines = {
    queequeg:"Queequeg signs the articles — his mark, an infinity. His harpoon never misses.",
    tashtego:"Tashtego of Gay Head, unmixed Indian blood, joins the crew.",
    daggoo:"Daggoo, gigantic and coal-black, ships aboard — a lion of a harpooneer.",
  };
  say(lines[key], true); checkLandProgress(); renderActions();
}
function hireSailor(){
  if(sailors().length >= G.sailorCap || !canAfford({food:25})) return;
  pay({food:25}); const u = addUnit('sailor');
  say(`${u.name} ships aboard for the lay.`); renderActions();
}
function loadProvisions(){
  let moved=false;
  for(const k of ['wood','food','gold']){
    const need = G.provReq[k]-G.provision[k];
    const give = Math.min(need, G.res[k]);
    if(give>0){ G.res[k]-=give; G.provision[k]+=give; moved=true; }
  }
  if(moved){ say("Stores swayed aboard the Pequod: casks, cables, beef and bread."); VIEW.ping(790, 512, 0xc9a24b); }
  checkLandProgress(); renderActions();
}
function forge(){
  const cost = G.harpoonLvl===0 ? {gold:30} : {gold:50};
  if(G.harpoonLvl>=2 || !canAfford(cost)) return;
  pay(cost); G.harpoonLvl++;
  VIEW.sparks(G.sites.smithy.x, G.sites.smithy.y);
  say(G.harpoonLvl===1 ? "Perth hammers out barbed harpoons, keen as razors." :
                         "Ahab's own harpoon — tempered, he mutters, in pagan blood.", true);
  checkLandProgress(); renderActions();
}
function hearSermon(){
  if(G.sermonHeard) return;
  G.sermonHeard = true;
  say("Father Mapple preaches Jonah from the prow-shaped pulpit. The crew stands steadier. (+boat hull)", true);
  renderActions();
}

function provDone(){ return ['wood','food','gold'].every(k=>G.provision[k]>=G.provReq[k]); }

function checkLandProgress(){
  updateHUD();
  if(G.chapter===1 && G.res.wood>=100 && G.res.food>=60) openChapter(2);
  else if(G.chapter===2 && G.built.inn && G.crew.queequeg) openChapter(3);
  else if(G.chapter===3 && G.built.shipyard && provDone()) openChapter(4);
  // chapter 4 completes via the Set Sail button
}
function ch4Ready(){
  return G.crew.queequeg && G.crew.tashtego && G.crew.daggoo && G.harpoonLvl>=1 && provDone();
}

/* ------------------------------------------------ sea setup -------- */
function setupSea(){
  G.scene='sea';
  $('oilBox').style.display='';
  G.sea.whalesKilled=0; G.sea.whale=null; G.sea.squallT=rnd(20,30); G.sea.rainT=0;
  const boatCount = 3;
  const hull = 50 * (G.sermonHeard?1.25:1);
  G.sea.boats = [];
  const hn = ['queequeg','tashtego','daggoo'];
  for(let i=0;i<boatCount;i++){
    G.sea.boats.push({
      id:i, hp:hull, max:hull, x:170, y:250+i*55, home:{x:170,y:250+i*55},
      state:'aboard', hitT:rnd(0,1), harpooneer:hn[i],
      mate:['Starbuck','Stubb','Flask'][i], face:0, row:Math.random()*6,
    });
  }
  VIEW.buildSea();
  spawnWhale();
}
function boatDps(){ return 5 + 4*G.harpoonLvl + (G.sharpenDay?3:0); }
function spawnWhale(){
  G.sea.whale = {x:W-20, y:rnd(140,470), hp:420, max:420, atkT:2.6, spout:0, drift:rnd(14,20),
                 diveT:0, nextDive:rnd(10,15), face:Math.PI};
  say("From the mast-head: “There she blows!—there she blows! A hump like a snow-hill!”", true);
}
function lowerBoats(){
  let n=0;
  for(const b of G.sea.boats) if(b.state==='aboard'||b.state==='returning'){ b.state='rowing'; n++; }
  if(n){ say("“Lower away, and after him!” The boats splash down."); VIEW.splash(150,330,1.4); }
}
function recallBoats(){
  for(const b of G.sea.boats) if(b.state!=='aboard') b.state='returning';
  say("The signal flies: boats return to the ship.");
}

function godTick(){
  if(!G.god) return;
  G.res.oil = 9999;
  G.ship.hp = G.ship.max;
  for(const b of G.sea.boats){
    if(b.state==='sunk'){ b.state='aboard'; b.x=b.home.x; b.y=b.home.y; }
    b.hp = b.max;
  }
}
function updateSea(dt){
  godTick();
  const target = G.moby || G.sea.whale;

  // whale behavior
  if(G.sea.whale){
    const w = G.sea.whale;
    w.x -= w.drift*dt*0.7;
    w.spout += dt;
    if(w.x < 240) w.x = 240;
    w.face = Math.PI;
    if(w.diveT>0){
      w.diveT -= dt;
      if(w.diveT<=0) VIEW.splash(w.x, w.y, 1.5);
    } else {
      w.nextDive -= dt;
      if(w.nextDive<=0){
        w.diveT = 2.8; w.nextDive = rnd(12,17);
        VIEW.splash(w.x, w.y, 1.2);
        say("The whale sounds, and the line runs smoking from the tub.");
      }
    }
  }
  if(G.moby && !G.interlude){
    const m = G.moby;
    const px = m.x, py = m.y;
    m.spout += dt;

    if(m.diveT>0){
      m.diveT -= dt;
      if(m.diveT<=0){ VIEW.splash(m.x,m.y,2.2); say("He breaches — white water streaming from that hump like a snow-hill."); }

    } else if(m.phase==='charge'){
      // he runs straight at the Pequod, and you can see him coming
      const d = Math.max(1, dist(m, SHIP_AT));
      m.x += (SHIP_AT.x-m.x)/d * 195*dt;
      m.y += (SHIP_AT.y-m.y)/d * 195*dt;
      m.chargeT -= dt;
      m.wakeT = (m.wakeT||0) - dt;
      if(m.wakeT<=0){ m.wakeT = 0.22; VIEW.splash(m.x-60, m.y, 0.55); }
      if(d < 172 || m.chargeT<=0){
        if(d < 205){
          const dmg = Math.round(rnd(30,52) * (1+0.18*(G.day-1)));
          G.ship.hp -= dmg;
          VIEW.shake(1.5); VIEW.splash(m.x-95, m.y, 3.0);
          say(`He bursts his broad forehead against the Pequod's bow! (−${dmg} hull)`);
          if(G.god) G.ship.hp = G.ship.max;
          else if(G.ship.hp<=0) return defeat('ship');
        } else {
          say("He sheers off at the last, and the blow goes wide.");
        }
        m.phase='recover'; m.recoverT = 2.4;
      }

    } else if(m.phase==='recover'){
      const d = Math.max(1, dist(m, SHIP_AT));
      m.x += (m.x-SHIP_AT.x)/d * 130*dt;
      m.y += (m.y-SHIP_AT.y)/d * 130*dt;
      m.x=clamp(m.x,330,W-80); m.y=clamp(m.y,120,H-90);
      m.recoverT -= dt;
      if(m.recoverT<=0){ m.phase='cruise'; m.ramT = Math.max(5, rnd(11,15) - 1.6*(G.day-1)); }

    } else {
      m.x += Math.sin(G.t*0.5)*20*dt; m.y += Math.cos(G.t*0.33)*26*dt;
      m.x=clamp(m.x,330,W-80); m.y=clamp(m.y,120,H-90);
      m.ramT -= dt;
      if(m.ramT<=0){
        m.phase='charge'; m.chargeT = 7;
        // the boats fast to him are swept aside as he turns
        let swept = 0;
        for(const b of G.sea.boats) if(b.state==='fighting'){ b.hp = Math.max(1, b.hp - rnd(8,14)); swept++; }
        VIEW.shake(0.45);
        say(swept ? "He turns his wrinkled brow upon the ship, sweeping the boats aside — the White Whale is coming on!"
                  : "He turns his wrinkled brow upon the ship — the White Whale is coming on!", true);
      }
      m.nextDive -= dt;
      if(m.nextDive<=0){ m.diveT=4; m.nextDive=rnd(11,15); VIEW.splash(m.x,m.y,1.8); say("He sounds! The line whistles out — wait for him to rise."); }
    }
    if(Math.hypot(m.x-px, m.y-py) > 0.02) m.face = Math.atan2(-(m.y-py), m.x-px);
  }

  // boats
  let engaged=0;
  for(const b of G.sea.boats){
    if(b.state==='sunk') continue;
    const px=b.x, py=b.y;
    if(b.state==='rowing' && target){
      const gx=target.x-42-Math.abs(b.id-1)*24, gy=target.y + (b.id-1)*54;
      const d=Math.hypot(gx-b.x, gy-b.y);
      if(d>10){ b.x+=(gx-b.x)/d*60*dt; b.y+=(gy-b.y)/d*60*dt; }
      else b.state='fighting';
    } else if(b.state==='fighting' && target){
      engaged++;
      const vulnerable = !(target.diveT > 0);
      if(vulnerable){
        target.hp -= boatDps()*dt;
      }
      // keep close
      const gx=target.x-42-Math.abs(b.id-1)*24, gy=target.y+(b.id-1)*54;
      b.x += (gx-b.x)*dt*1.5; b.y += (gy-b.y)*dt*1.5;
    } else if(b.state==='returning' || (b.state==='fighting' && !target) || (b.state==='rowing' && !target)){
      const d=dist(b,b.home);
      if(d>8){ b.x+=(b.home.x-b.x)/d*70*dt; b.y+=(b.home.y-b.y)/d*70*dt; }
      else b.state='aboard';
    }
    const dx=b.x-px, dy=b.y-py;
    if(Math.hypot(dx,dy) > 0.05) b.face = Math.atan2(-dy, dx);
    b.row += dt * (b.state==='rowing' ? 7 : b.state==='fighting' ? 2.5 : 4);
  }

  // whale strikes back
  if(target && engaged>0 && !(target.diveT > 0)){
    target.atkT -= dt;
    if(target.atkT<=0){
      target.atkT = G.moby ? 2.2 - 0.25*(G.day-1) : 2.8;
      const live = G.sea.boats.filter(b=>b.state==='fighting');
      if(live.length){
        const b = live[Math.floor(Math.random()*live.length)];
        const dmg = Math.round(G.moby ? rnd(16,26)*(1+0.1*(G.day-1)) : rnd(9,16));
        b.hp -= dmg;
        VIEW.splash(b.x, b.y, 0.8);
        if(b.hp<=0){
          b.state='sunk'; b.hp=0;
          VIEW.splash(b.x, b.y, 2.0); VIEW.shake(0.5);
          say(`${b.mate}'s boat is stove and splintered! The crew swims for the ship.`);
          if(G.sea.boats.every(x=>x.state==='sunk')){
            if(G.moby && !G.god) return defeat('boats');
            else if(G.moby){ for(const x of G.sea.boats){x.state='aboard';x.hp=x.max;x.x=x.home.x;x.y=x.home.y;} }
            else { say("All boats stove. The carpenter builds anew… (boats restored)"); for(const x of G.sea.boats){x.state='aboard';x.hp=x.max*0.6;x.x=x.home.x;x.y=x.home.y;} }
          }
        }
      }
    }
  }

  // squalls during whale hunts
  if(!G.moby){
    G.sea.squallT -= dt;
    if(G.sea.squallT<=0){
      G.sea.squallT = rnd(24,36);
      const out = G.sea.boats.filter(b=>b.state==='rowing'||b.state==='fighting');
      if(out.length){
        for(const b of out) b.hp = Math.max(4, b.hp - rnd(6,12));
        G.sea.rainT = 9;
        say("A squall bursts over the boats — drenched, chilled, and battered!");
      }
    }
  }
  if(G.sea.rainT>0) G.sea.rainT -= dt;

  // whale death
  if(G.sea.whale && G.sea.whale.hp<=0){
    VIEW.blood(G.sea.whale.x, G.sea.whale.y, 1);
    G.sea.whale=null; G.sea.whalesKilled++;
    G.res.oil += 80;
    say(`The whale turns fin out — dead. Tried out for <b>80 oil</b>. (${G.sea.whalesKilled}/3)`, true);
    for(const b of G.sea.boats) if(b.state!=='sunk') b.state='returning';
    if(G.sea.whalesKilled>=3){ setTimeout(()=>openChapter(6), 1200); }
    else setTimeout(()=>{ if(G.scene==='sea' && !G.moby) spawnWhale(); }, 4000);
  }

  // moby day end
  if(G.moby && G.moby.hp<=0){
    VIEW.blood(G.moby.x, G.moby.y, 1.7);
    if(G.day<3){
      G.interlude = true;
      for(const b of G.sea.boats) if(b.state!=='sunk') b.state='returning';
      interludePage();
    } else {
      victory();
    }
  }
}

const SHIP_AT = {x:150, y:330};        // where the Pequod lies during the chase
function startDay(day){
  G.day = day; G.interlude=false; G.sharpenDay=false;
  const hp = 820 + 260*(day-1);
  G.moby = {x:W-160, y:H/2, hp, max:hp, atkT:2.2, spout:0, ramT:rnd(13,17),
            diveT:0, nextDive:rnd(9,13), face:Math.PI, phase:'cruise', chargeT:0, recoverT:0, wakeT:0};
  G.sea.whale = null;
  VIEW.setMood();
  say(`— THE CHASE, DAY ${['','FIRST','SECOND','THIRD'][day]} — “There she blows!—there she blows! … It is Moby Dick!”`, true);
}

/* repairs (oil economy) */
function repairBoats(){
  if(G.res.oil<25) return;
  G.res.oil-=25;
  for(const b of G.sea.boats){
    if(b.state==='sunk'){ b.state='aboard'; b.x=b.home.x; b.y=b.home.y; b.hp=b.max*0.7; }
    else b.hp=b.max;
  }
  say("The carpenter patches planks; stove boats made whole again.");
  renderActions();
}
function repairShip(){
  if(G.res.oil<30 || G.ship.hp>=G.ship.max) return;
  G.res.oil-=30; G.ship.hp=Math.min(G.ship.max, G.ship.hp+60);
  say("Oakum and copper — the Pequod's hull is mended (+60).");
  renderActions();
}
function sharpen(){
  if(G.res.oil<40 || G.sharpenDay) return;
  G.res.oil-=40; G.sharpenDay=true;
  say("Every lance and harpoon ground to a whisper's edge (+damage today).");
  renderActions();
}

/* ------------------------------------------------ quick start ------
   index.html#hunt   — straight to the first lowering
   index.html#chase  — straight to the three-day chase (also #day2, #day3)
   index.html#god    — the chase, with a hull that cannot be stove in
   -------------------------------------------------------------------- */
const QUICK = {hunt:'hunt', chase:1, moby:1, day1:1, day2:2, day3:3, god:1};
function quickStart(){
  const h = (location.hash||'').replace('#','').toLowerCase();
  if(!(h in QUICK)) return false;
  // outfit her as though the land chapters had been played through
  G.res = {wood:400, food:400, gold:400, oil: h==='god' ? 9999 : 260};
  G.crew = {queequeg:true, tashtego:true, daggoo:true};
  G.built = {inn:true, chapel:true, smithy:true, shipyard:true};
  G.sermonHeard = true;
  G.harpoonLvl = 2;
  G.provision = {wood:140, food:120, gold:70};
  G.god = (h === 'god');
  hideOverlay();
  G.chapter = 5;
  setupSea();
  if(QUICK[h] !== 'hunt'){
    G.chapter = 6;
    G.sea.whalesKilled = 3;
    G.log.length = 0;
    startDay(QUICK[h]);
  }
  updateHUD(); renderActions();
  if(G.god) say("GOD MODE — the Pequod cannot founder, the boats cannot be stove, the casks never empty.", true);
  return true;
}

/* ------------------------------------------------ HUD / actions ---- */
function updateHUD(){
  $('rWood').textContent = Math.floor(G.res.wood);
  $('rFood').textContent = Math.floor(G.res.food);
  $('rGold').textContent = Math.floor(G.res.gold);
  $('rOil').textContent  = Math.floor(G.res.oil);
  $('rCrew').textContent = G.units.length || (G.scene!=='land' ? 3+harpCount() : 0);
  const obj = {
    1:`Gather 100 wood (${Math.floor(G.res.wood)}) & 60 provisions (${Math.floor(G.res.food)})`,
    2:`${G.built.inn?'✓ Inn':'Raise the Spouter-Inn'} · ${G.crew.queequeg?'✓ Queequeg':'Sign Queequeg'}`,
    3:`${G.built.shipyard?'✓ Shipyard':'Raise the Shipyard'} · Provision: 🪵${G.provision.wood}/${G.provReq.wood} 🍖${G.provision.food}/${G.provReq.food} 🟡${G.provision.gold}/${G.provReq.gold}`,
    4:`Sign all harpooneers (${harpCount()}/3) · Forge harpoons (${G.harpoonLvl}/1+) · then set sail`,
    5:`Sperm whales taken: ${G.sea.whalesKilled}/3 — tap a whale to lower boats`,
    6:G.moby?`DAY ${G.day} OF 3 — the White Whale: ${Math.max(0,Math.round(G.moby.hp))} · Pequod hull: ${Math.max(0,Math.round(G.ship.hp))}`:'',
  }[G.chapter] || '';
  $('objective').textContent = obj;
}

/* ------------------------------------------------ input ------------ */
/* the pointer is raycast onto the y=0 plane, then converted back into the
   original 1000x620 logical coordinates so the game logic is untouched. */
const _ndc = new THREE.Vector2();
const _ray = new THREE.Raycaster();
const _plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const _hit = new THREE.Vector3();

cv.addEventListener('pointerdown', e=>{
  if(!VIEW.camera) return;
  const r = cv.getBoundingClientRect();
  _ndc.x =  ((e.clientX - r.left)/r.width )*2 - 1;
  _ndc.y = -((e.clientY - r.top )/r.height)*2 + 1;
  _ray.setFromCamera(_ndc, VIEW.camera);
  if(!_ray.ray.intersectPlane(_plane, _hit)) return;
  const x = lx(_hit.x), y = ly(_hit.z);
  if(G.scene==='land') landTap(x,y);
  else if(G.scene==='sea') seaTap(x,y);
});

/* tap radii, widened on small screens so a fingertip still lands on things */
function touchSlack(){
  const px = Math.min(innerWidth, innerHeight);
  return px < 720 ? 1.7 : 1.0;
}
function landTap(x,y){
  const p={x,y};
  const uR = 26*touchSlack();
  const nR = 34*touchSlack();
  // gather all candidates within reach, pick the closest
  const cands=[];
  for(const u of G.units){ const d=dist(u,p); if(d<uR) cands.push({d, hit:()=>{G.selected=(G.selected===u)?null:u; refreshSel();}}); }
  for(const n of G.nodes){ const d=dist(n,p); if(d<nR) cands.push({d:d+4, hit:()=>{assignGather(n); refreshSel();}}); }
  if(cands.length){ cands.sort((a,b)=>a.d-b.d)[0].hit(); return; }
  // move selected
  if(G.selected){ G.selected.task=null; G.selected.tx=x; G.selected.ty=y; VIEW.ping(x,y,0x9fc6e0); }
}
function seaTap(x,y){
  const p={x,y};
  const t = G.moby || G.sea.whale;
  const r = (G.moby ? 110 : 82) * touchSlack();
  if(t && dist(t,p)<r){ lowerBoats(); return; }
}
function refreshSel(){
  $('selinfo').textContent = G.selected
    ? `Selected: ${G.selected.name}${G.selected.type==='harpooneer'?' — harpooneer':''}`
    : '';
  VIEW.syncSelection();
}

function canvas2d(w,h){
  const c = document.createElement('canvas'); c.width=w; c.height=h;

function canvasTex(c, {repeat=1, srgb=true, aniso=8}={}){

/* ---------- sky: one equirect canvas is both background and IBL ----- */
function skyTexture(mood){
  const [c, g] = canvas2d(1024, 512);
  const P = {
    dusk:  { top:'#101f33', mid:'#2c4a66', horizon:'#55636e', sea:'#132a38', sun:'#fdf6e2', sunY:0.40, sunX:0.30, sunR:22, stars:260, glow:'rgba(200,216,238,' },
    day:   { top:'#123048', mid:'#4a7c99', horizon:'#c6d2c9', sea:'#12303f', sun:'#fff8e6', sunY:0.19, sunX:0.16, sunR:17, stars:0,   glow:'rgba(255,244,214,' },
    storm: { top:'#0e1a24', mid:'#31414c', horizon:'#7d6a58', sea:'#0d1a24', sun:'#e8c49a', sunY:0.26, sunX:0.16, sunR:20, stars:0,   glow:'rgba(226,178,138,' },
    blood: { top:'#07060c', mid:'#1b1119', horizon:'#3a241f', sea:'#060510', sun:'#ff8f4a', sunY:0.37, sunX:0.16, sunR:18, stars:130, glow:'rgba(255,116,58,'  },
  }[mood];

  // sky band (top half of the equirect is above the horizon)
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,   P.top);
  grd.addColorStop(0.55,P.mid);
  grd.addColorStop(1,   P.horizon);
  g.fillStyle = grd; g.fillRect(0,0,1024,258);
  // below the horizon — the same tone the fog will use, so seams vanish
  const grd2 = g.createLinearGradient(0,256,0,512);
  grd2.addColorStop(0, P.horizon); grd2.addColorStop(0.12, P.sea); grd2.addColorStop(1, P.sea);
  g.fillStyle = grd2; g.fillRect(0,254,1024,258);

  // stars
  for(let i=0;i<P.stars;i++){
    const x = Math.random()*1024, y = Math.random()*200;
    const a = (1 - y/220) * (0.25 + Math.random()*0.75);
    g.fillStyle = `rgba(240,244,255,${a.toFixed(3)})`;
    g.fillRect(x, y, Math.random()<0.12?2:1, Math.random()<0.12?2:1);
  }
  // luminary + its glow
  const sx = P.sunX*1024, sy = P.sunY*512;
  const ha = mood==='blood' ? 0.34 : 0.55;
  const halo = g.createRadialGradient(sx,sy,0, sx,sy,P.sunR*7);
  halo.addColorStop(0, P.glow+ha+')'); halo.addColorStop(0.35, P.glow+(ha*0.22).toFixed(3)+')'); halo.addColorStop(1, P.glow+'0)');
  g.fillStyle = halo; g.beginPath(); g.arc(sx,sy,P.sunR*7,0,7); g.fill();
  g.fillStyle = P.sun;
  g.beginPath(); g.arc(sx,sy,P.sunR,0,7);
  if(mood==='dusk') g.arc(sx-P.sunR*0.40, sy-P.sunR*0.30, P.sunR*0.90, 0, 7);  // gibbous
  g.fill('evenodd');
  // a low band of cloud
  g.globalAlpha = mood==='storm' ? 0.5 : 0.22;
  for(let i=0;i<40;i++){
    const x=Math.random()*1024, y=150+Math.random()*100, w=60+Math.random()*220, h=6+Math.random()*22;
    g.fillStyle = mood==='storm'? '#1a1f25' : (mood==='blood'? '#4a2a22' : '#6a7382');
    g.beginPath(); g.ellipse(x,y,w,h,0,0,7); g.fill();
  }
  g.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return { tex, horizon:new THREE.Color(P.horizon), sea:new THREE.Color(P.sea) };
}

const skyCache = {};
function sky(mood){
  if(!skyCache[mood]){
    const s = skyTexture(mood);
    s.env = pmrem.fromEquirectangular(s.tex).texture;
    skyCache[mood] = s;
  }
  return skyCache[mood];
}

function labelSprite(text, {color='#e9dcc0', size=40, scale=1}={}){
  const pad = 12, font = `${size}px "Palatino Linotype", Georgia, serif`;
  const [m, mg] = canvas2d(8,8); mg.font = font;
  const wpx = Math.ceil(mg.measureText(text).width) + pad*2;
  const hpx = size + pad*2;
  const [c,g] = canvas2d(THREE.MathUtils.ceilPowerOfTwo(wpx), THREE.MathUtils.ceilPowerOfTwo(hpx));
  g.font = font; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='rgba(0,0,0,.95)'; g.shadowBlur=8;
  g.fillStyle=color;
  g.fillText(text, c.width/2, c.height/2);
  g.shadowBlur=0; g.fillText(text, c.width/2, c.height/2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthTest:false, depthWrite:false}));
  const k = 0.019*scale;
  sp.scale.set(c.width*k, c.height*k, 1);
  sp.renderOrder = 20;

}

/* A lofted hull: stations along X, a U-section at each, plus a deck. */
function loftHull({len, beam, depth, sternFine=0.42, bowFine=0.88, sheer=0.20,
                   round=0.85, stations=26, ring=14, deck=true}){
  const pos=[], idx=[];
  const hbAt = t => (beam/2) * Math.pow(Math.max(1e-4, Math.sin(Math.PI*t)), lerp(sternFine,bowFine,t));
  const deckAt = t => depth*sheer*(0.10 + 1.6*Math.pow(2*t-1,2)) + (t>0.5 ? depth*sheer*0.5*Math.pow(2*t-1,3) : 0);
  const keelAt = t => -depth*Math.pow(Math.max(1e-4, Math.sin(Math.PI*t)), 0.30);
  for(let i=0;i<=stations;i++){
    const t=i/stations, x=(t-0.5)*len, hb=hbAt(t), dy=deckAt(t), ky=keelAt(t);
    for(let j=0;j<=ring;j++){
      const a = Math.PI*(j/ring);
      pos.push(x, dy + (ky-dy)*Math.pow(Math.sin(a), round), -hb*Math.cos(a));
    }
  }
  const rw = ring+1;
  for(let i=0;i<stations;i++) for(let j=0;j<ring;j++){
    const a=i*rw+j, b=a+rw;
    idx.push(a,b,a+1, a+1,b,b+1);
  }
  if(deck){
    const base = pos.length/3;
    for(let i=0;i<=stations;i++){
      const t=i/stations, x=(t-0.5)*len, hb=hbAt(t)*0.985, dy=deckAt(t);
      pos.push(x, dy, -hb, x, dy, hb);
    }
    for(let i=0;i<stations;i++){
      const a=base+i*2;
      idx.push(a,a+1,a+2, a+1,a+3,a+2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}

/* --- the Pequod ----------------------------------------------------- */
function makePequod(){
  const G3 = new THREE.Group();
  const LEN = 19, BEAM = 5.2, DEP = 3.0;

  const hull = new THREE.Mesh(loftHull({len:LEN, beam:BEAM, depth:DEP, sheer:0.26}), MAT.dark);
  hull.castShadow = hull.receiveShadow = true; G3.add(hull);

  // a pale wale-strake and a gold band that lights when she is laden
  const strake = new THREE.Mesh(loftHull({len:LEN*1.002, beam:BEAM*1.02, depth:DEP*0.30, sheer:0.34, deck:false}), MAT.wood2);
  strake.position.y = 0.30; strake.castShadow = true; G3.add(strake);
  const band = new THREE.Mesh(loftHull({len:LEN*1.004, beam:BEAM*1.03, depth:DEP*0.10, sheer:0.42, deck:false}), std(C.gold,{r:.4,m:.7}));
  band.position.y = 0.52; band.visible = false; G3.add(band);
  G3.userData.band = band;

  // bulwarks — a low rail running the sheer
  const rail = new THREE.Mesh(loftHull({len:LEN*0.94, beam:BEAM*0.94, depth:0.55, sheer:0.9, deck:false}), MAT.wood);
  rail.position.y = 1.05; rail.castShadow = true; G3.add(rail);

  const mastMat = MAT.wood, yardMat = MAT.rope;
  const masts = [[-5.4, 10.5],[0.6, 12.6],[5.6, 10.0]];   // mizzen, main, fore
  const sails = [], furls = [], staysails = [];
  masts.forEach(([mx, mh], mi)=>{
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, mh, 7), mastMat);
    m.position.set(mx, mh/2 + 0.9, 0); m.rotation.z = -0.03; m.castShadow = true; G3.add(m);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.16,8), MAT.wood);
    top.position.set(mx, mh*0.62, 0); G3.add(top);
    for(let k=0;k<3;k++){
      const yh = mh*(0.34 + k*0.21) + 1.0;
      const yw = (mh*0.60) * (1 - k*0.15);
      const yg = new THREE.Group();
      yg.position.set(mx, yh, 0);
      yg.rotation.y = 0.62 + mi*0.05;                     // yards braced round
      const y = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,yw,6), yardMat);
      y.rotation.x = Math.PI/2; y.castShadow = true; yg.add(y);
      const sh = mh*0.215;
      const sgeo = new THREE.PlaneGeometry(yw*0.94, sh, 10, 2);
      const s = new THREE.Mesh(sgeo, MAT.sail);
      s.position.set(0, -sh/2 - 0.07, 0); s.rotation.y = Math.PI/2; s.castShadow = true;
      s.userData.base = sgeo.attributes.position.array.slice();
      s.userData.phase = mi*1.7 + k*0.8;
      yg.add(s); sails.push(s);
      const furl = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,yw*0.9,6), MAT.sail);
      furl.rotation.x = Math.PI/2; furl.position.y = -0.20; furl.visible = false;
      furl.castShadow = true; yg.add(furl); furls.push(furl);
      G3.add(yg);
    }
  });
  G3.userData.sails = sails;

  // fore-and-aft canvas, in the plane of the ship's length
  const sheet = (pts2d, z)=>{
    const v=[]; for(let i=1;i<pts2d.length-1;i++){
      v.push(pts2d[0][0],pts2d[0][1],z, pts2d[i][0],pts2d[i][1],z, pts2d[i+1][0],pts2d[i+1][1],z);
    }
    const g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
    g2.computeVertexNormals();
    const m2 = new THREE.Mesh(g2, MAT.sail); m2.castShadow = true; return m2;
  };
  for(const [pts,z] of [[[[12.4,2.8],[7.6,1.8],[7.1,8.2]],0.10],       // flying jib
                        [[[9.7,2.5],[6.4,1.8],[6.0,6.3]],-0.10],       // inner jib
                        [[[-5.7,2.6],[-11.2,3.1],[-11.2,7.9],[-5.7,8.6]],0.06]]){ // spanker
    const m3 = sheet(pts, z); G3.add(m3); staysails.push(m3);
  }
  for(const [x0,y0,x1,y1] of [[-5.7,2.6,-11.4,3.1],[-5.7,8.6,-11.4,7.9]]){   // boom and gaff
    const L2 = Math.hypot(x1-x0, y1-y0);
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,L2,6), MAT.rope);
    sp.position.set((x0+x1)/2, (y0+y1)/2, 0.06);
    sp.rotation.z = Math.atan2(y1-y0, x1-x0) - Math.PI/2;
    sp.castShadow = true; G3.add(sp);
  }
  // a pennant at the main truck
  const pen = sheet([[0,0],[-2.4,0.30],[-2.2,-0.45]], 0);
  pen.material = new THREE.MeshStandardMaterial({color:0x8e2a1e, roughness:.9, side:THREE.DoubleSide});
  pen.position.set(masts[1][0], masts[1][1]+0.55, 0); G3.add(pen);
  G3.userData.pennant = pen;

  // standing rigging
  const lines = [];
  const push=(a,b)=>{ lines.push(a.x,a.y,a.z,b.x,b.y,b.z); };
  const V = (x,y,z)=>new THREE.Vector3(x,y,z);
  masts.forEach(([mx,mh])=>{
    for(const sgn of [-1,1]) for(const dx of [-1.1, 0, 1.1]){
      push(V(mx, mh*0.72+0.9, 0), V(mx+dx, 1.15, sgn*BEAM*0.40));
    }
  });
  push(V(masts[0][0], masts[0][1]*0.8, 0), V(-LEN*0.46, 1.5, 0));
  push(V(masts[2][0], masts[2][1]*0.8, 0), V( LEN*0.47, 1.9, 0));
  push(V(masts[1][0], masts[1][1]*0.9, 0), V(masts[2][0], masts[2][1]*0.62, 0));
  push(V(masts[1][0], masts[1][1]*0.9, 0), V(masts[0][0], masts[0][1]*0.62, 0));
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(lines,3));
  G3.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({color:0x1a1208, transparent:true, opacity:.85})));

  // bowsprit
  const bs = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.17,5.4,6), MAT.wood);
  bs.position.set(LEN*0.52, 2.0, 0); bs.rotation.z = Math.PI/2 - 0.22; bs.castShadow = true; G3.add(bs);

  // try-works: the brick furnace amidships, where the blubber is boiled
  const tw = new THREE.Mesh(new THREE.BoxGeometry(2.4,1.0,2.2), std(0x6b4a3a,{r:.95, flat:true}));
  tw.position.set(-2.4, 1.35, 0); tw.castShadow = true; G3.add(tw);
  const twGlow = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.16,1.4), MAT.forge);
  twGlow.position.set(-2.4, 1.87, 0); twGlow.visible = false; G3.add(twGlow);
  G3.userData.tryworks = twGlow;

  // the doubloon, nailed to the mainmast
  const dbl = new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.07,18), MAT.gold);
  dbl.position.set(masts[1][0]+0.24, 5.4, 0); dbl.rotation.x = Math.PI/2; dbl.rotation.z = Math.PI/2;
  dbl.visible = false; G3.add(dbl);
  G3.userData.doubloon = dbl;
  G3.userData.setFurled = f => {
    for(const x of sails) x.visible = !f;
    for(const x of staysails) x.visible = !f;
    for(const x of furls) x.visible = f;
  };

  // a lantern at the stern
  const lant = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), MAT.glow);
  lant.position.set(-LEN*0.46, 2.3, 0); G3.add(lant);
  const lantL = new THREE.PointLight(0xffc070, 6, 16, 2);
  lantL.position.copy(lant.position); G3.add(lantL);

  return G3;
}

/* --- the whale ------------------------------------------------------ */
/* A sperm whale: blunt cliff of a head, tapering body, wide flukes. */
const WHALE_T   = [0.00, 0.05, 0.12, 0.22, 0.34, 0.46, 0.58, 0.70, 0.80, 0.90, 0.96, 1.00];
const WHALE_TOP = [0.008,0.024,0.052,0.086,0.108,0.124,0.136,0.150,0.158,0.158,0.146,0.090];
const WHALE_BOT = [0.008,0.020,0.042,0.066,0.080,0.086,0.088,0.086,0.082,0.078,0.070,0.045];
const WHALE_SIDE= [0.005,0.015,0.038,0.062,0.080,0.092,0.098,0.100,0.100,0.098,0.088,0.050];
const WHALE_BOX = [2.2,  2.2,  2.2,  2.2,  2.3,  2.5,  2.8,  3.2,  3.6,  3.8,  3.6,  3.0 ];

function tableAt(tab, t){
  for(let i=1;i<WHALE_T.length;i++){
    if(t <= WHALE_T[i]){
      const k = (t-WHALE_T[i-1])/(WHALE_T[i]-WHALE_T[i-1]);
      return lerp(tab[i-1], tab[i], k);
    }
  }
  return tab[tab.length-1];
}
const spow = (v,e)=> Math.sign(v)*Math.pow(Math.abs(v), e);

function loftWhaleBody(L, stations=40, ring=20){
  const pos=[], idx=[];
  for(let i=0;i<=stations;i++){
    const t=i/stations, x=(t-0.5)*L;
    const rt=tableAt(WHALE_TOP,t)*L, rb=tableAt(WHALE_BOT,t)*L,
          rs=tableAt(WHALE_SIDE,t)*L, n=tableAt(WHALE_BOX,t), e=2/n;
    for(let j=0;j<ring;j++){
      const a = (j/ring)*Math.PI*2;
      const sa = Math.sin(a), ca = Math.cos(a);
      pos.push(x, spow(sa,e)*(sa>=0?rt:rb), spow(ca,e)*rs);
    }
  }
  for(let i=0;i<stations;i++) for(let j=0;j<ring;j++){
    const j2=(j+1)%ring, a=i*ring+j, b=a+ring;
    idx.push(a, b, i*ring+j2, i*ring+j2, b, (i+1)*ring+j2);
  }
  // caps
  const capA = pos.length/3; pos.push(-L/2, 0, 0);
  for(let j=0;j<ring;j++) idx.push(capA, (j+1)%ring, j);
  const capB = pos.length/3; pos.push(L/2*0.995, tableAt(WHALE_TOP,1)*L*0.1, 0);
  const last = stations*ring;
  for(let j=0;j<ring;j++) idx.push(capB, last+j, last+(j+1)%ring);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}

function swimify(mat, L, phase, amp){
  mat.onBeforeCompile = sh=>{
    sh.uniforms.uTime = uTime;
    sh.uniforms.uPhase = {value:phase};
    sh.uniforms.uAmp = {value:amp};
    sh.uniforms.uLen = {value:L};
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform float uPhase; uniform float uAmp; uniform float uLen;`)
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3( position );
        float tt  = clamp((position.x + uLen*0.5)/uLen, 0.0, 1.0);
        float amp = pow(1.0 - tt, 1.7);
        transformed.z += sin(tt*5.5 - uTime*2.1 + uPhase) * uAmp * amp;
        transformed.y += sin(tt*4.0 - uTime*1.3 + uPhase) * uAmp * 0.16 * amp;`);
  };
  mat.customProgramCacheKey = ()=>'swim'+phase.toFixed(2);
  return mat;
}

function makeWhale(isMoby){
  const L = isMoby ? 17 : 11.5;
  const g = new THREE.Group();
  const base = isMoby
    ? new THREE.MeshStandardMaterial({color:C.moby, roughness:.62, metalness:.03})
    : new THREE.MeshStandardMaterial({color:C.whale, roughness:.55, metalness:.06});
  const phase = Math.random()*6;
  const skin = swimify(base, L, phase, L*0.055);
  const skin2 = swimify(base.clone(), L, phase, L*0.055);
  skin2.color = new THREE.Color(isMoby ? 0xcfc6b2 : 0x2a363d);

  const body = new THREE.Mesh(loftWhaleBody(L), skin); g.add(body);

  // flukes
  const fs = new THREE.Shape();
  const k = L;
  fs.moveTo( 0.045*k, 0);
  fs.quadraticCurveTo( 0.020*k, 0.10*k, -0.085*k, 0.195*k);
  fs.quadraticCurveTo(-0.015*k, 0.085*k, -0.060*k, 0.006*k);
  fs.quadraticCurveTo(-0.015*k,-0.085*k, -0.085*k,-0.195*k);
  fs.quadraticCurveTo( 0.020*k,-0.10*k,  0.045*k, 0);
  const fg = new THREE.ExtrudeGeometry(fs, {depth:0.014*k, bevelEnabled:true, bevelSize:0.006*k, bevelThickness:0.004*k, bevelSegments:2, curveSegments:10});
  fg.translate(0,0,-0.007*k); fg.rotateX(Math.PI/2); fg.translate(-L*0.50, 0, 0);
  g.add(new THREE.Mesh(fg, skin));

  // dorsal hump and the row of knuckles down the ridge
  for(let i=0;i<5;i++){
    const t = 0.34 - i*0.055;
    const h = (0.030 - i*0.005)*L;
    if(h<=0.004*L) break;
    const kn = new THREE.Mesh(new THREE.ConeGeometry(h*0.9, h*1.5, 5), skin);
    kn.position.set((t-0.5)*L, tableAt(WHALE_TOP,t)*L*0.9, 0);
    kn.rotation.z = -0.35; g.add(kn);
  }

  // flippers
  for(const sgn of [-1,1]){
    const fl = new THREE.Mesh(new THREE.SphereGeometry(0.055*L, 8, 6), skin2);
    fl.scale.set(1.5, 0.22, 0.62);
    fl.position.set(0.13*L, -0.055*L, sgn*0.085*L);
    fl.rotation.y = sgn*0.5; fl.rotation.z = -0.25; g.add(fl);
  }

  // the long narrow lower jaw, hung with teeth
  const jaw = new THREE.Mesh(new THREE.CylinderGeometry(0.014*L, 0.030*L, 0.40*L, 7), skin2);
  jaw.rotation.z = Math.PI/2; jaw.position.set(0.27*L, -0.072*L, 0);
  g.add(jaw);

  // eye, set far back at the corner of that great head
  for(const sgn of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.011*L, 8, 6), std(0x08111a,{r:.25}));
    eye.position.set(0.20*L, -0.02*L, sgn*tableAt(WHALE_SIDE,0.70)*L*0.96);
    g.add(eye);
  }

  // the spout, held ready and scaled up when he blows
  const spoutMat = new THREE.PointsMaterial({map:dotTex, color:0xe9f2f6, size:0.9, transparent:true,
    opacity:.0, depthWrite:false, sizeAttenuation:true, blending:THREE.NormalBlending});
  const N=90, sp=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const u=i/N, r=u*0.10*L*(0.3+Math.random());
    const a=Math.random()*Math.PI*2;
    sp[i*3]   = 0.40*L + Math.cos(a)*r*0.5;
    sp[i*3+1] = 0.12*L + u*0.40*L;
    sp[i*3+2] = Math.sin(a)*r;
  }
  const sgeo = new THREE.BufferGeometry();
  sgeo.setAttribute('position', new THREE.Float32BufferAttribute(sp,3));
  const spout = new THREE.Points(sgeo, spoutMat);
  g.add(spout); g.userData.spout = spout;

  if(isMoby){
    // "his wrinkled brow and crooked jaw" — and a forest of old irons
    for(let i=0;i<9;i++){
      const sc = new THREE.Mesh(new THREE.BoxGeometry(rnd(0.4,1.6), 0.05, 0.10), std(0xb9ae99,{r:.6}));
      const t = rnd(0.15,0.92);
      sc.position.set((t-0.5)*L, tableAt(WHALE_TOP,t)*L*rnd(-0.4,0.85), rnd(-1,1)*tableAt(WHALE_SIDE,t)*L*0.8);
      sc.rotation.set(rnd(0,3), rnd(0,3), rnd(-0.6,0.6));
      g.add(sc);
    }
    for(let i=0;i<4;i++){
      const t = rnd(0.30,0.62);
      const ir = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,1.9,5), MAT.iron);
      ir.position.set((t-0.5)*L, tableAt(WHALE_TOP,t)*L + 0.5, rnd(-0.5,0.5));
      ir.rotation.set(rnd(-0.4,0.4), 0, rnd(-0.5,0.5));
      g.add(ir);
    }
    g.userData.wounded = true;
  }
  g.userData.L = L;
  return g;
}

function prism(w, h, d){
  const s = new THREE.Shape();
  s.moveTo(-w/2, 0); s.lineTo(w/2, 0); s.lineTo(0, h); s.lineTo(-w/2, 0);
  const geo = new THREE.ExtrudeGeometry(s, {depth:d, bevelEnabled:false});
  geo.translate(0,0,-d/2);
  return geo;
}
function makeBuilding(key, site){
  const w = site.w*S*1.15, d = site.h*S*1.15, hgt = key==='chapel'?5.2:4.6;
  const g = new THREE.Group();
  // sill of rough stone
  const sill = new THREE.Mesh(new THREE.BoxGeometry(w+0.5, 0.5, d+0.5), MAT.stone);
  sill.position.y = 0.25; sill.castShadow = sill.receiveShadow = true; g.add(sill);
  // clapboard body
  const bodyMat = key==='chapel' ? MAT.stone : (key==='smithy' ? std(0x3b2f22,{r:.92,flat:true}) : MAT.wood);
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d), bodyMat);
  body.position.y = 0.5 + hgt/2; body.castShadow = body.receiveShadow = true; g.add(body);
  // roof
  const roof = new THREE.Mesh(prism(w+0.9, hgt*0.62, d+0.7), MAT.dark);
  roof.position.y = 0.5 + hgt; roof.castShadow = true; g.add(roof);
  // door
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.15, 2.0, 0.14), MAT.dark);
  door.position.set(0, 1.5, d/2+0.05); g.add(door);
  // lit windows — these are what bloom picks up at dusk
  const winY = hgt*0.62;
  const wins = [];
  for(const sx of [-w*0.30, w*0.30]){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 1.1), MAT.glow);
    win.position.set(sx, winY, d/2+0.03); wins.push(win); g.add(win);
    const win2 = win.clone(); win2.position.z = -d/2-0.03; win2.rotation.y = Math.PI; g.add(win2); wins.push(win2);
  }
  const lamp = new THREE.PointLight(0xffbe6e, key==='smithy'?18:12, key==='smithy'?22:18, 2);
  lamp.position.set(0, winY+0.4, d/2+1.2); g.add(lamp);

  if(key==='chapel'){
    const tower = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.4, 2.0), MAT.stone);
    tower.position.set(0, 0.5+hgt+1.2, -d*0.18); tower.castShadow=true; g.add(tower);
    const spire = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.2, 4), MAT.dark);
    spire.position.set(0, 0.5+hgt+4.4, -d*0.18); spire.rotation.y=Math.PI/4; spire.castShadow=true; g.add(spire);
    const arch = new THREE.Mesh(new THREE.PlaneGeometry(0.7,1.0), MAT.glow);
    arch.position.set(0, 0.5+hgt+1.4, -d*0.18+1.02); g.add(arch);
  }
  if(key==='smithy'){
    const ch = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.0, 1.1), MAT.stone);
    ch.position.set(w*0.34, 0.5+hgt+1.4, -d*0.2); ch.castShadow=true; g.add(ch);

/* --- water ----------------------------------------------------------- */
function makeWater(size, segs, {amp=0.55, color=0x123544, rough=0.30, chop=1.0, metal=0.02}={}){
  const geo = new THREE.PlaneGeometry(size, size, segs, segs).rotateX(-Math.PI/2);
  const mat = new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal });
  mat.onBeforeCompile = sh=>{
    sh.uniforms.uTime = uTime;
    sh.uniforms.uAmp  = { value: amp };
    sh.uniforms.uChop = { value: chop };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime; uniform float uAmp; uniform float uChop;
        varying float vWaveH;
        float waveH(vec2 p){
          float t = uTime;
          float h = 0.0;
          h += sin(dot(p, vec2( 0.180, 0.058)) + t*1.15) * 1.00;
          h += sin(dot(p, vec2(-0.112, 0.252)) + t*1.00) * 0.62;
          h += sin(dot(p, vec2( 0.405,-0.194)) + t*1.75) * 0.30 * uChop;
          h += sin(dot(p, vec2( 0.660, 0.524)) + t*2.60) * 0.15 * uChop;
          h += sin(dot(p, vec2(-1.05,  0.820)) + t*3.60) * 0.07 * uChop;
          return h;
        }`)
      .replace('#include <beginnormal_vertex>', `
        float e  = 0.45;
        float h  = waveH(position.xz);
        float hx = waveH(position.xz + vec2(e, 0.0));
        float hz = waveH(position.xz + vec2(0.0, e));
        vec3 objectNormal = normalize(vec3(-(hx-h)*uAmp/e, 1.0, -(hz-h)*uAmp/e));
        vWaveH = h;`)
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3(position.x, position.y + h*uAmp, position.z);`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying float vWaveH;`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        diffuseColor.rgb *= mix(0.80, 1.14, smoothstep(-1.9, 1.9, vWaveH));
        float foam = smoothstep(1.80, 2.30, vWaveH);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.78,0.86,0.89), foam*0.5);`);
  };
  mat.customProgramCacheKey = ()=>'water'+amp+chop;
  const m = new THREE.Mesh(geo, mat);
  m.userData.waveH = (x,z)=>{        // the same sum, on the CPU, so hulls float
    const t = uTime.value;
    let h = 0;
    h += Math.sin(x*0.180 + z*0.058 + t*1.15) * 1.00;
    h += Math.sin(x*-0.112+ z*0.252 + t*1.00) * 0.62;
    h += Math.sin(x*0.405 + z*-0.194+ t*1.75) * 0.30*chop;
    h += Math.sin(x*0.660 + z*0.524 + t*2.60) * 0.15*chop;
    h += Math.sin(x*-1.05 + z*0.820 + t*3.60) * 0.07*chop;
    return h*amp;
  };
  return m;
}

/* --- the painted ground of New Bedford ------------------------------ */
const PW = 200, PD = 150, SHORE = 15.2, PCZ = SHORE - PD/2;
const EDGE = '52,60,58';
function groundTexture(){
  const IW = 1280, IH = 960;
  const [c,g] = canvas2d(IW,IH);
  const PX = x => (wx(x) + PW/2)/PW * IW;
  const PY = y => (wz(y) - PCZ + PD/2)/PD * IH;
  const blob = (x,y,r,col,a)=>{ g.globalAlpha=a; g.fillStyle=col;
    g.beginPath(); g.ellipse(x,y,r,r*rnd(.5,.9),rnd(0,3),0,7); g.fill(); g.globalAlpha=1; };

  g.fillStyle = '#564c3b'; g.fillRect(0,0,IW,IH);
  for(let i=0;i<900;i++) blob(rnd(0,IW), rnd(0,IH), rnd(14,70), ['#645843','#4a4132','#6f6249','#3f382c'][i&3], rnd(.12,.32));

  // scrub and old snow on the timber ground, north-west
  for(let i=0;i<300;i++){
    const x=rnd(PX(-140),PX(470)), y=rnd(PY(-60),PY(310));
    blob(x,y,rnd(10,26), i%4? '#414a36':'#8d979a', i%4? rnd(.10,.20):rnd(.04,.09));
  }
  // shingle beach along the waterfront
  const beach = g.createLinearGradient(0, PY(H-260), 0, PY(H-150));
  beach.addColorStop(0,'rgba(106,92,70,0)'); beach.addColorStop(1,'rgba(122,106,80,.55)');
  g.fillStyle = beach; g.fillRect(0, PY(H-260), IW, PY(H-150)-PY(H-260));

  // the cobbled ways: inn -> stores -> shipyard, and the waterfront street
  g.lineCap='round'; g.strokeStyle='#6d6551'; g.lineWidth=44;
  const road = pts => { g.beginPath(); g.moveTo(PX(pts[0][0]),PY(pts[0][1]));
    for(let i=1;i<pts.length;i++) g.lineTo(PX(pts[i][0]),PY(pts[i][1])); g.stroke(); };
  road([[60,430],[300,395],[470,378],[700,372],[960,392]]);
  road([[300,300],[320,378]]);
  road([[455,272],[470,372]]);
  road([[600,378],[610,438]]);
  road([[150,362],[220,392]]);
  g.strokeStyle='#7d7561'; g.lineWidth=34; road([[60,430],[300,395],[470,378],[700,372],[960,392]]);
  // cobbles
  for(let i=0;i<2600;i++){
    const t=Math.random(), x=lerp(PX(60),PX(960),t)+rnd(-6,6), y=PY(lerp(430,392,t))+rnd(-19,19);
    g.globalAlpha=rnd(.06,.20); g.fillStyle=Math.random()<.5?'#7a7059':'#443f33';
    g.beginPath(); g.ellipse(x,y,rnd(2.5,5),rnd(1.8,3.4),rnd(0,3),0,7); g.fill();
  }
  g.globalAlpha=1;
  // cart ruts and puddles catching the last of the light
  for(let i=0;i<40;i++) blob(rnd(PX(80),PX(950)), PY(rnd(360,420)), rnd(5,16), '#2b3b44', rnd(.2,.45));
  // fade every edge into the surrounding land colour so no seam shows
  const fade = (x0,y0,x1,y1,w,h)=>{
    const gr = g.createLinearGradient(x0,y0,x1,y1);
    gr.addColorStop(0, `rgb(${EDGE})`); gr.addColorStop(0.55, `rgba(${EDGE},.55)`); gr.addColorStop(1, `rgba(${EDGE},0)`);
    g.fillStyle = gr; g.fillRect(Math.min(x0,x1), Math.min(y0,y1), w, h);
  };
  fade(0,0, IW*0.20,0, IW*0.20, IH);
  fade(IW,0, IW*0.80,0, IW*0.20, IH);
  fade(0,0, 0,IH*0.30, IW, IH*0.30);
  fade(0,IH, 0,IH*0.88, IW, IH*0.12);
  return canvasTex(c, {repeat:1});
}
function plankTexture(){
  const [c,g] = canvas2d(256,256);
  g.fillStyle='#4a3722'; g.fillRect(0,0,256,256);
  for(let i=0;i<8;i++){
    g.fillStyle = ['#523d26','#42311e','#59452a','#3b2c1b'][i&3];
    g.fillRect(0, i*32, 256, 30);
    g.strokeStyle='rgba(0,0,0,.5)'; g.beginPath(); g.moveTo(0,i*32+31); g.lineTo(256,i*32+31); g.stroke();
    for(let k=0;k<24;k++){ g.globalAlpha=rnd(.05,.16); g.fillStyle='#241708';
      g.fillRect(rnd(0,256), i*32+rnd(2,26), rnd(6,40), 1.6); g.globalAlpha=1; }
  }
  return canvasTex(c, {repeat:1});
}

function buildLand(){
  const sc = baseScene('dusk', 70, 215);
  landScene = sc;

  sc.add(new THREE.HemisphereLight(0x44637f, 0x2e2519, 1.15));
  const moon = new THREE.DirectionalLight(0xd6e2f2, 3.5);
  moon.position.set(-15, 58, -62); moon.target.position.set(0,0,-6);
  moon.castShadow = true;
  moon.shadow.mapSize.set(QUALITY.shadow, QUALITY.shadow);
  const sc2 = moon.shadow.camera;
  sc2.left=-70; sc2.right=70; sc2.top=58; sc2.bottom=-58; sc2.near=1; sc2.far=220;
  moon.shadow.bias = -0.0012; moon.shadow.normalBias = 0.03;
  sc.add(moon); sc.add(moon.target);
  const fill = new THREE.DirectionalLight(0x8098b4, 0.95);
  fill.position.set(24, 26, 70); sc.add(fill);

  // ground
  const gm = new THREE.Mesh(new THREE.PlaneGeometry(PW, PD, 1, 1).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({map:groundTexture(), roughness:.97}));
  gm.position.z = PCZ; gm.receiveShadow = true; sc.add(gm);
  // stops short of the shore, so it can never poke through the harbour swell
  const out = new THREE.Mesh(new THREE.PlaneGeometry(2600, 800).rotateX(-Math.PI/2),
    std(0x3a3a30, {r:1}));
  out.position.set(0, -0.10, SHORE - 400); sc.add(out);

  // distant tree line and rooftops, for depth
  const cone = new THREE.ConeGeometry(1,1,6);
  const tl = new THREE.InstancedMesh(cone, std(0x2a3a36,{r:1, flat:true}), 320);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sv = new THREE.Vector3(), pv = new THREE.Vector3();
  for(let i=0;i<320;i++){
    const zz = -50 - Math.pow(Math.random(),0.6)*72;
    const hh = rnd(5.5, 11.0);
    pv.set(rnd(-150,150), hh/2, zz); sv.set(rnd(2.0,3.4), hh, rnd(2.0,3.4));
    tl.setMatrixAt(i, m4.compose(pv, q, sv));
  }
  tl.instanceMatrix.needsUpdate = true; sc.add(tl);

  // harbour water + the far ocean
  const water = makeWater(300, Math.round(QUALITY.seaSegs*0.8), {amp:0.36, color:0x18404f, chop:0.55, rough:0.42});
  water.position.set(0, 0, SHORE + 151);
  sc.add(water); land.water = water;
  const far = new THREE.Mesh(new THREE.PlaneGeometry(3000,3000).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({color:sc.userData.sky.sea, fog:true}));
  far.position.set(0,-7, SHORE+200); sc.add(far);

  // the wharf
  const planks = plankTexture(); planks.repeat.set(26, 1);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(122, 0.5, 4.0),
    new THREE.MeshStandardMaterial({map:planks, roughness:.94}));
  deck.position.set(0, 0.28, SHORE + 1.0);
  deck.castShadow = deck.receiveShadow = true; sc.add(deck);
  for(let x=-58; x<=58; x+=3.4){
    const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.28,3.4,6), MAT.plank);
    pil.position.set(x, -1.1, SHORE + 2.5); sc.add(pil);
    if(Math.random()<0.18){
      const bol = new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.26,0.9,8), MAT.dark);
      bol.position.set(x, 0.85, SHORE + 2.3); bol.castShadow=true; sc.add(bol);
    }
  }

  // resource nodes
  land.nodes = [];
  for(const n of G.nodes){
    const g3 = n.kind==='wood' ? makeTree() : n.kind==='food' ? makeRack() : makeCrates();
    g3.scale.setScalar(n.kind==='wood' ? 1.35 : 1.25);
    g3.position.set(wx(n.x), 0, wz(n.y));
    g3.rotation.y = rnd(0,6);
    g3.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    sc.add(g3);
    land.nodes.push({n, g3});
  }

  // wharf stores
  const stores = new THREE.Group();
  for(const [bx,bz] of [[-1.4,0],[0,0.2],[-0.7,-1.1],[1.2,-0.6]]){
    const b = makeBarrel(); b.position.set(bx,0,bz); stores.add(b);
  }
  const crate = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.2,1.4), MAT.wood);
  crate.position.set(2.4,0.6,0.6); crate.castShadow=crate.receiveShadow=true; stores.add(crate);
  const sl = labelSprite('Wharf stores', {size:34, scale:.95}); sl.position.set(0,2.6,0); stores.add(sl);
  stores.position.set(wx(G.stock.x), 0, wz(G.stock.y));
  sc.add(stores);

  // buildings — ghost outlines until raised
  land.sites = {};
  for(const [k,s] of Object.entries(G.sites)){
    const holder = new THREE.Group();
    holder.position.set(wx(s.x), 0, wz(s.y));
    holder.rotation.y = ({inn:0.10, chapel:-0.16, smithy:0.06, shipyard:-0.05})[k] || 0;
    const ghost = makeSiteGhost(s); holder.add(ghost);
    const lbl = labelSprite(s.name, {size:34, scale:.95});
    lbl.position.set(0, 8.6, 0); lbl.visible = false; holder.add(lbl);
    holder.visible = false;
    sc.add(holder);
    land.sites[k] = {holder, ghost, lbl, built:null, site:s};
  }

  // the rest of the town, in silhouette behind the playable buildings
  for(let i=0;i<30;i++){
    const bx = rnd(-98, 98), bz = -22 - Math.pow(Math.random(),0.7)*26;
    if(Math.abs(bx) < 30 && bz > -30) continue;
    const bw = rnd(5,11), bd = rnd(4,8), bh = rnd(3,5.5);
    const grp = new THREE.Group();
    const bod = new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd), std(0x363023,{r:.96, flat:true}));
    bod.position.y = bh/2; bod.castShadow = bod.receiveShadow = true; grp.add(bod);
    const rf = new THREE.Mesh(prism(bw+0.7, bh*0.55, bd+0.55), MAT.dark);
    rf.position.y = bh; rf.castShadow = true; grp.add(rf);
    if(Math.random()<0.6){
      const wq = new THREE.Mesh(new THREE.PlaneGeometry(0.65,0.8), MAT.glow);
      wq.position.set(rnd(-bw*0.28,bw*0.28), bh*0.58, bd/2+0.04); grp.add(wq);
    }
    grp.position.set(bx, 0, bz); grp.rotation.y = rnd(-0.45,0.45);
    sc.add(grp);
  }
  // a far steeple to sit on the skyline
  const st1 = new THREE.Mesh(new THREE.BoxGeometry(3,9,3), std(0x3a3428,{r:.96, flat:true}));
  st1.position.set(-56, 4.5, -40); st1.castShadow = true; sc.add(st1);
  const st2 = new THREE.Mesh(new THREE.ConeGeometry(2.3, 7, 4), MAT.dark);
  st2.position.set(-56, 12.5, -40); st2.rotation.y = Math.PI/4; st2.castShadow = true; sc.add(st2);

  // the Pequod at her moorings
  const ship = makePequod();

function addUnitMesh(u){
  if(!landScene || !land.units || land.units.has(u.id)) return;

  g3.position.set(wx(u.x), 0, wz(u.y));
  landScene.add(g3);

}

function raiseBuilding(key){
  const rec = land.sites[key]; if(!rec || rec.built) return;
  rec.holder.remove(rec.ghost); disposeDeep(rec.ghost); rec.ghost = null;
  const b = makeBuilding(key, rec.site);
  rec.holder.add(b); rec.built = b; rec.lbl.visible = true;
  rec.lbl.position.y = key==='chapel' ? 12.5 : 8.6;
  const p = rec.holder.position;
  dust(lx(p.x), ly(p.z));
}

/* mood follows the chase: clear, then squally, then the reddened third day */
function setMood(){
  if(!seaScene) return;
  const want = !G.moby ? 'day' : (G.day>=3 ? 'blood' : G.day===2 ? 'storm' : 'day');
  if(want === mood) return;
  mood = want;
  const sk = sky(want);
  seaScene.background = sk.tex;
  seaScene.environment = sk.env;
  seaScene.environmentIntensity = want==='blood' ? 0.42 : want==='storm' ? 0.8 : 1.0;
  seaScene.backgroundIntensity  = want==='blood' ? 0.85 : 1.0;
  seaScene.fog.color.copy(sk.horizon);
  seaScene.userData.fogNear = want==='storm'?70:90; seaScene.userData.fogFar = want==='storm'?190:250; applyFog();
  if(sea.far) sea.far.material.color.copy(sk.sea);
  if(sea.sun){
    sea.sun.color.set(want==='blood'?0xff8a4a: want==='storm'?0xb6c3cd : 0xfff0d2);
    sea.sun.userData.base = want==='storm'?1.5 : want==='blood'?1.25 : 2.4;
  }
  if(sea.hemi){
    sea.hemi.color.set(want==='blood'?0x53393c : want==='storm'?0x76858f : 0xa8c8de);
    sea.hemi.groundColor.set(want==='blood'?0x1a1016 : 0x123040);
    sea.hemi.intensity = want==='blood'?0.55 : want==='storm'?1.1 : 1.5;
  }
  if(sea.water) sea.water.material.color.set(want==='blood'?0x171320 : want==='storm'?0x24404f : 0x21536b);
}

const fxList = [];
function disposeDeep(o){
  o.traverse(n=>{
    if(n.geometry) n.geometry.dispose();
    if(n.material){ const ms = Array.isArray(n.material)?n.material:[n.material];
      for(const m of ms){ if(m.__shared) continue; m.dispose(); } }
  });
}
for(const m of Object.values(MAT)) m.__shared = true;

function addFX(obj, life, tick){
  if(!scene) return;
  scene.add(obj);
  fxList.push({obj, t:0, life, tick});
}
function updateFX(dt){
  for(let i=fxList.length-1;i>=0;i--){
    const f = fxList[i]; f.t += dt;
    if(f.t >= f.life){ if(f.obj.parent) f.obj.parent.remove(f.obj); disposeDeep(f.obj); fxList.splice(i,1); continue; }
    if(f.tick) f.tick(f.t/f.life, dt, f.obj);
  }
}
function burst(px,py,pz, {n=36, color=0xffffff, size=0.55, speed=6, life=1.1, grav=9, up=1.2, additive=false, spread=1}={}){
  if(reduceMotion) return;
  const pos = new Float32Array(n*3), vel = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = Math.random();
    pos[i*3]=px+rnd(-.2,.2); pos[i*3+1]=py; pos[i*3+2]=pz+rnd(-.2,.2);
    vel[i*3]   = Math.cos(a)*r*speed*spread;
    vel[i*3+1] = speed*up*rnd(0.35,1.0);
    vel[i*3+2] = Math.sin(a)*r*speed*spread;
  }
  const geo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({map:dotTex, color, size, transparent:true, opacity:1,
    depthWrite:false, sizeAttenuation:true, blending: additive?THREE.AdditiveBlending:THREE.NormalBlending});
  const pts = new THREE.Points(geo, mat);
  addFX(pts, life, (k, dt)=>{
    const p = geo.attributes.position.array;
    for(let i=0;i<n;i++){
      vel[i*3+1] -= grav*dt;
      p[i*3]+=vel[i*3]*dt; p[i*3+1]+=vel[i*3+1]*dt; p[i*3+2]+=vel[i*3+2]*dt;
    }
    geo.attributes.position.needsUpdate = true;
    mat.opacity = 1-k*k;
  });
}
function ringFX(px,py,pz, color, r0, r1, life){
  const geo = new THREE.RingGeometry(0.86, 1.0, 40).rotateX(-Math.PI/2);
  const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:.9, side:THREE.DoubleSide, depthWrite:false});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(px,py,pz);
  addFX(m, life, k=>{ const r = lerp(r0,r1,k); m.scale.set(r,1,r); mat.opacity = 0.9*(1-k); });
}

const API_FX = {
  ping(x,y,color){ ringFX(wx(x), 0.07, wz(y), color, 0.6, 3.2, 0.85); },
  puff(x,y,kind){
    const col = kind==='wood'? 0x6b4f26 : kind==='food'? 0xb8b0a0 : 0xc9a24b;
    burst(wx(x), 1.6, wz(y), {n:20, color:col, size:0.34, speed:3.4, life:0.9, grav:8});
  },
  sparks(x,y){
    burst(wx(x)+1.2, 2.0, wz(y)+2.6, {n:60, color:0xffa542, size:0.26, speed:8, life:1.0, grav:13, additive:true});
    ringFX(wx(x), 0.08, wz(y), 0xff8a3c, 0.6, 5.0, 0.9);
  },
  dust(x,y){
    burst(wx(x), 0.6, wz(y), {n:44, color:0x9a8f78, size:0.8, speed:5, life:1.4, grav:3.4, up:0.6, spread:2.4});
  },
  splash(x,y,s=1){
    const h = sea.water ? sea.water.userData.waveH(wx(x), wz(y)) : 0;
    burst(wx(x), h+0.2, wz(y), {n:Math.round(40*s), color:0xdeeaf0, size:0.46*s, speed:6.5*s, life:1.1, grav:11});
    burst(wx(x), h+0.1, wz(y), {n:Math.round(18*s), color:0xf2f8fb, size:1.5*s, speed:2.2*s, life:1.5, grav:2.5, up:0.3, spread:2.2});
  },
  blood(x,y,s=1){
    const h = sea.water ? sea.water.userData.waveH(wx(x), wz(y)) : 0;
    burst(wx(x), h+0.4, wz(y), {n:70, color:0x8e1a12, size:0.7*s, speed:7*s, life:1.6, grav:10});
    if(reduceMotion) return;
    // a slick of points that rides the swell — a flat decal would be sliced
    const N = 230, ang = new Float32Array(N), rad = new Float32Array(N);
    const pos = new Float32Array(N*3);
    for(let i=0;i<N;i++){ ang[i]=Math.random()*Math.PI*2; rad[i]=Math.sqrt(Math.random()); }
    const geo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    const mat = new THREE.PointsMaterial({map:dotTex, color:0x6e1610, size:4.8*s, transparent:true,
      opacity:0, depthWrite:false, sizeAttenuation:true});
    const pts = new THREE.Points(geo, mat);
    const buf = geo.attributes.position.array;   // note: the attribute owns its own copy
    const cx = wx(x), cz = wz(y), wf = sea.water ? sea.water.userData.waveH : ()=>0;
    addFX(pts, 15, k=>{
      const R = lerp(1.2, 12*s, Math.min(1, k*3.0));
      for(let i=0;i<N;i++){
        const px = cx + Math.cos(ang[i])*rad[i]*R, pz = cz + Math.sin(ang[i])*rad[i]*R;
        buf[i*3]=px; buf[i*3+1]=wf(px,pz)+0.10; buf[i*3+2]=pz;
      }
      geo.attributes.position.needsUpdate = true;
      mat.opacity = 0.40 * Math.min(1, k*9) * (1-k)*(1-k);
    });
  },
  shake(a){ clockShake.amt = Math.min(1.6, clockShake.amt + a); },
};
const {ping, puff, sparks, dust, splash, blood, shake} = API_FX;

   per-frame sync
